# Three pages, no copies: docs/index.md is written here; docs/list.md includes
# README.md from "## Contents" to the end (a pymdownx.snippets section); and
# docs/contributing.md includes the root contributing.md. The README stays the
# single source that awesome-lint-extra governs.
site_name: Awesome Europe
site_url: https://geiserx.github.io/awesome-europe/
site_description: A curated list of open source software built for Europe, its institutions, regulations, standards and cross-border infrastructure.
repo_url: https://github.com/GeiserX/awesome-europe
repo_name: GeiserX/awesome-europe

# A warning is a broken link, a missing page or a page nobody can reach. All of
# them fail the build, locally and in CI, so nobody has to remember --strict.
strict: true

theme:
  name: material
  language: en
  logo: images/logo.svg
  favicon: images/icon.svg
  # Dark first: the first palette entry is the default, and the banner is dark.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  # No tabs: three pages are a nav, not sections, and Material would fold them
  # into a single tab. No edit button: two of the three pages are includes, so
  # the edit link would open a one-line stub instead of the README.
  features:
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

# MkDocs reports most link problems as `info`, which --strict ignores. Every
# line here promotes one of them to a warning so the build fails on it. The one
# that matters most here is links.anchors: every entry of the README's Contents
# list, and every category link on the home page, must land on a real heading
# of the list page. A missing or misspelled `[start:list]` marker never gets
# this far: pymdownx.snippets (check_paths below) raises SnippetMissingError
# and the build aborts. links.anchors guards the other case, a marker moved
# so that a category heading falls outside the included section.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

plugins:
  - search

# The list page renders about 2,700 shields.io badges. The hook marks every
# <img> on that page lazy, so a browser fetches only the badges near the
# viewport instead of all of them on load.
hooks:
  - hooks/lazy_images.py

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Includes resolve against the repository root only: docs/list.md pulls
  # README.md:list and docs/contributing.md pulls contributing.md. Listing docs/
  # as a second base would make "contributing.md" ambiguous between the root
  # file and the page that includes it. check_paths makes a renamed or missing
  # file, or a missing section marker, raise SnippetMissingError and abort the
  # build instead of rendering an empty page.
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - attr_list
  # Renders the README's <div align="center"> and the home page's grid cards.
  - md_in_html
  # Turns :material-xxx: shortcodes into icons on the home page cards.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  # GitHub-style anchors: "VAT, Customs, and Trade" becomes
  # #vat-customs-and-trade on GitHub and here alike, so the README's Contents
  # links keep working on the site.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GeiserX/awesome-europe

extra_css:
  - stylesheets/theme.css

# Files under docs/ that are not pages. MkDocs publishes every file in docs/,
# so anything that is not part of the site must be listed here.
exclude_docs: |
  [A-Z]*.md
  design/
  research/
  notes/
  requirements-docs.txt

nav:
  - Home: index.md
  - The list: list.md
  - Contributing: contributing.md
